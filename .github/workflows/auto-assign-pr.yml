name: Auto Assign PR

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assign PR and request reviews
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const reviewersConfig = JSON.parse(fs.readFileSync(".github/reviewers.json", "utf8"));
            const allReviewers = reviewersConfig.reviewers || [];

            const author = context.payload.pull_request.user.login;
            const reviewers = allReviewers.filter((reviewer) => reviewer !== author);

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [author],
            });

            if (reviewers.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers,
              });
            }
