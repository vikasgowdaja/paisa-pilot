name: Auto PR to develop

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse PR to develop
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "develop";
            const branch = context.ref.replace("refs/heads/", "");
            const head = `${owner}:${branch}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head,
              per_page: 1
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists for ${branch} -> ${base}: #${existing[0].number}`);
              return;
            }

            const title = `${branch} → ${base}`;
            const body = [
              `Automated PR for branch \`${branch}\` into \`${base}\`.`,
              "",
              `Triggered by push to \`${branch}\`.`
            ].join("\n");

            const { data: created } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base,
              title,
              body,
              maintainer_can_modify: true
            });

            core.info(`Created PR #${created.number}: ${created.html_url}`);
